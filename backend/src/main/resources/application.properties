server.port=8081

# Application Identity
spring.application.name=ai-digital-crime-investigation-agent

# ============================================================
# Database: Supabase PostgreSQL (cloud)
# Set these via .env or environment variables before running.
# Falls back to in-memory H2 for local dev without credentials.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:investigation_archive;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
# 'update' = auto-create/migrate tables on startup (safe for first run)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database dialect (auto-detected from datasource: H2 locally, PostgreSQL in Supabase)
# spring.jpa.properties.hibernate.dialect can be overridden via SPRING_JPA_DIALECT if needed


# External Machine Learning Service URL (FastAPI)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.com.investigation.agent=INFO
logging.level.org.springframework.web=INFO
